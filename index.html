<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random OC Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;min-height:100vh;display:flex;justify-content:center;padding:30px}
.container{width:900px}
h1{text-align:center;font-size:42px;margin-bottom:10px}
.subtitle{text-align:center;margin-bottom:25px;color:#ddd}
.row{background:#f5e7e7;border-radius:8px;padding:10px;margin-bottom:12px;display:flex;align-items:center;min-height:70px}
.category-btn,.generate-all{
background:#6b0000;color:#fff;border:none;border-radius:6px;cursor:pointer
}
.category-btn{min-width:190px;height:50px;font-size:18px}
.generate-all{width:100%;height:60px;font-size:24px;margin-top:10px}
.result{margin-left:25px;font-size:22px;font-weight:bold;color:#000}
.skin-box{width:55px;height:55px;border-radius:6px;border:2px solid rgba(0,0,0,.2);margin-left:25px}
</style>
</head>
<body>
<div class="container">
<h1>Random OC Generator</h1>
<div class="subtitle">Click any category to randomize it</div>

<div class="row"><button class="category-btn" onclick="generate('pose')">Pose</button><div class="result" id="pose"></div></div>
<div class="row"><button class="category-btn" onclick="generateSkin()">Skin Tone</button><div class="skin-box" id="skin"></div></div>
<div class="row"><button class="category-btn" onclick="generate('hair')">Hair Style</button><div class="result" id="hair"></div></div>
<div class="row"><button class="category-btn" onclick="generate('hairColor')">Hair Colour</button><div class="result" id="hairColor"></div></div>
<div class="row"><button class="category-btn" onclick="generate('brand1')">Brand 1</button><div class="result" id="brand1"></div></div>
<div class="row"><button class="category-btn" onclick="generate('top')">Top</button><div class="result" id="top"></div></div>
<div class="row"><button class="category-btn" onclick="generate('brand2')">Brand 2</button><div class="result" id="brand2"></div></div>
<div class="row"><button class="category-btn" onclick="generate('bottom')">Bottom</button><div class="result" id="bottom"></div></div>
<div class="row"><button class="category-btn" onclick="generate('shoes')">Shoes</button><div class="result" id="shoes"></div></div>
<div class="row"><button class="category-btn" onclick="generate('belt')">Belt</button><div class="result" id="belt"></div></div>
<div class="row"><button class="category-btn" onclick="generate('accessory')">Accessory</button><div class="result" id="accessory"></div></div>
<div class="row"><button class="category-btn" onclick="generate('chain')">Chain</button><div class="result" id="chain"></div></div>

<button class="generate-all" onclick="generateAll()">Generate Full OC</button>
</div>

<script>
const skinTones=["#E8D5A0","#CC9A74","#CD965D","#B86E45","#EBD5B2","#E5BA7B","#9E693A","#743B0A","#E8CF92","#E0B788","#B49064","#8E4F24","#EAC99A","#C06B37","#844913","#341400"];

const options={
pose:["YVL","Nonchalant","Floating","Selfie","Mirror Fit Pic","Shadow Clone Jutsu","Meditation Pose","Crossed Arms","Leaning On Something","Thinking","Bicep Flex","On Phone","On DS","Hands Behind Head","Middle Finger","Not Looking At Camera","Dynamic Angle","Monkey On Shoulder","Bird On Shoulder","Reptile On Shoulder","Reading Book","On Throne"],
hair:["Dreads","2 Strand Twists","Canerows","Fro","Fringe","Curly","Mullet","Buzz","Waves","Low Taper Fade","Curtains","Curly Long","Barrel Rolls","Half Done Hair"],
hairColor:["Dark Brown","Black","Light Brown","Blonde","Dark Brown + Blonde Tips","Pink","Blue","Green","Red"],
brand1:["Infamous","Off-White","Ralph Lauren","Supreme","Stussy","Nike","Adidas","Bape","SP5DER","Mertra","Chrome Hearts"],
top:["Football Shirt","Vintage Polo","Plain White Tee","Long Sleeve","Suit Shirt","Jumper","Hoodie","Leather Jacket","Tank Top","Fur Coat","Puffer","Fleece","Quarter Zip","Basketball Jersey","Flannel","Suit Shirt + Tie","Bulletproof Vest","Half Plaid Zip Up","Windbreaker"],
brand2:["Infamous","Off-White","Ralph Lauren","Supreme","Stussy","Nike","Adidas","Bape","SP5DER","Mertra","Chrome Hearts","Levi's"],
bottom:["Camo Shorts","Cargos","Baggy Jeans","Flared Jeans","Jorts","Mesh Shorts + Lil Sag","Joggers (Uncuffed)","Waxed Denim","Designer Jeans","Swimming Shorts","Skinny Jeans"],
shoes:["Jordan 1","Jordan 3","Rick Owens","Adidas Superstar","Converse","Timberland Boot","Football Boot","Basketball Shoes","Crocs","Nike Yeezys","Nike Dunks","Socks And Sandals","Bapestas","Air Max 95s"],
belt:["None","Chrome Hearts","Off-White","LV","Plain Belt","Infamous Music Belt"],
accessory:["Infamous Skeleton Bag","LV Crossbody Bag","Beanie","Cap","Scarf","Goggles","Watch","Grillz","Wallet Chain","Rings","Bat","Water Gun","Glasses","Shades","Durag","AirPods","PlayStation Controller","Skateboard","Balaclava","Bandana","Gloves","Bucket Hat","Cash","Medieval Helmet","Furry Hat","Skull Cap","Lollipop","Plaster On Nose","Bunny Mask"],
chain:["None","1 Chain","2 Chains"]
};

function rand(a){return a[Math.floor(Math.random()*a.length)]}
function generate(c){document.getElementById(c).textContent=rand(options[c])}
function generateSkin(){document.getElementById("skin").style.background=rand(skinTones)}
function generateAll(){generateSkin();for(let c in options){generate(c)}}
generateAll();
</script>
</body>
</html>
